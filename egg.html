        }

        body {
            background-color: #050510;
            color: #00ff66;

            flex-direction: column;
            align-items: center;

            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
        }

        /* CONTENEDOR ESTILO PANTALLA CRT */
        .arcade-container {
            background-color: #111125;
            border: 6px solid #d32f2f;
            border-radius: 4px;
            box-shadow: 0 0 30px rgba(211, 47, 47, 0.4), inset 0 0 20px rgba(0,0,0,1);
            width: 100%;
            max-width: 850px;
            padding: 25px;
            position: relative;
        }

        /* MARQUESINA SUPERIOR */
        .arcade-header {
            border-bottom: 4px dashed #ffeb3b;
            padding-bottom: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .pixel-logo {
            height: 50px;
            border: 2px solid #fff;
            background-color: #fff;
        }

        /* CONTENEDOR DE ESTRELLAS */
        .star-badge-container {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
        }

        .star-icon {
            display: inline-block;
            font-size: 1.4rem;
            animation: pulse 1s infinite alternate;
        }
        
        .star-yellow { color: #ffeb3b; text-shadow: 0 0 8px #ffeb3b; }
        .star-blue { color: #00e5ff; text-shadow: 0 0 8px #00e5ff; }

        .arcade-title {
            color: #ffeb3b;
            text-shadow: 2px 2px 0px #b71c1c;
            font-size: 1rem;
            text-transform: uppercase;
        }

        /* MARCADORES HUD */
        .hud-bar {
            display: flex;
            justify-content: space-between;
            background-color: #000;
            padding: 12px;
            border: 2px solid #333;
            margin-bottom: 20px;
            font-size: 0.65rem;
            line-height: 1.4;
            flex-wrap: wrap;
            gap: 10px;
        }

        .hud-item span {
            color: #fff;
        }

        /* PANTALLA DE PREGUNTAS */
        .quiz-screen {
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .question-text {
            font-size: 0.8rem;
            line-height: 1.8;
            margin-bottom: 25px;
            color: #ffffff;
            text-shadow: 0 0 5px rgba(255,255,255,0.3);
        }

        /* BOTONES DE OPCIONES */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            background-color: #000;
            border: 2px solid #00ff66;
            color: #00ff66;
            padding: 15px 12px;
            font-size: 0.7rem;
            line-height: 1.5;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        .option-btn:hover {
            background-color: #00ff66;
            color: #000;
            box-shadow: 0 0 15px #00ff66;
        }

        /* POPUPS Y ESTADOS */
        .secret-popup {
            background-color: #000;
            border: 4px solid #00e5ff;
            color: #00e5ff;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
            display: none;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
            font-size: 0.65rem;
            line-height: 1.6;
        }

        .blink { animation: blinker 1.5s linear infinite; }

        .screen-state { text-align: center; padding: 20px 10px; line-height: 1.8; }

        .start-btn {
            background-color: #ffeb3b;
            color: #000;
            border: 4px solid #b71c1c;
            padding: 15px 30px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
            text-transform: uppercase;
        }

        .start-btn:hover { background-color: #fff; box-shadow: 0 0 20px #ffeb3b; }

        @keyframes blinker { 50% { opacity: 0; } }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.2); } }

        .back-link {
            margin-top: 25px;
            color: #666;
            text-decoration: none;
            font-size: 0.55rem;
            text-align: center;
        }

                <div class="screen-state">
                    <h2 style="color: #ffeb3b; margin-bottom: 20px; font-size: 0.85rem;">¿ERES UN VERDADERO ESTUDIANTE?</h2>
                    <p style="font-size: 0.6rem; color: #fff; line-height: 1.8;">Supera las 100 preguntas sin fallar. Demuestra tu conocimiento del plantel y la cultura general.</p>
                    <button class="start-btn" onclick="iniciarTrivia()">START GAME</button>
                </div>
            `;
        }

        function actualizarMarcadorEstrellas() {
            zonaEstrellas.innerHTML = '';
            if (estrellasAcumuladas === 10) {
                zonaEstrellas.innerHTML = `<span class="star-icon star-blue">★</span> <span style="color: #00e5ff;">10</span>`;
            } else if (estrellasAcumuladas > 0) {
                zonaEstrellas.innerHTML = `<span class="star-icon star-yellow">★</span> <span style="color: #ffeb3b;">x${estrellasAcumuladas}</span>`;
            }
        }

        function iniciarTrivia() {
            preguntaActual = 0;
            correctasConsecutivas = 0;
            totalCorrectas = 0;
            estrellasAcumuladas = 0;
            juegoTerminado = false;
            cajaMensajeSecreto.style.display = "none";
            actualizarMarcadorEstrellas();
            cargarPregunta();
        }

        function cargarPregunta() {
            if (correctasConsecutivas === 100) {
                finalizarJuego(true);
                return;
            }

            const datosPregunta = bancoPreguntas[preguntaActual];
            
            contenedorPrincipal.innerHTML = `
                <div class="hud-bar">
                    <div class="hud-item">Q: <span>${preguntaActual + 1}/100</span></div>
                    <div class="hud-item">STREAK: <span>${correctasConsecutivas}</span></div>
                    <div class="hud-item">STARS: <span>${estrellasAcumuladas}/10</span></div>
                </div>
                <div class="quiz-screen">
                    <p class="question-text">&gt; ${datosPregunta.q}</p>
                    <div class="options-grid">
                        <button class="option-btn" onclick="verificarRespuesta(0)">A) ${datosPregunta.a[0]}</button>
                        <button class="option-btn" onclick="verificarRespuesta(1)">B) ${datosPregunta.a[1]}</button>
                        <button class="option-btn" onclick="verificarRespuesta(2)">C) ${datosPregunta.a[2]}</button>
                    </div>
                </div>
            `;
        }

        function verificarRespuesta(opcionSeleccionada) {
            const datosPregunta = bancoPreguntas[preguntaActual];
            
            if (opcionSeleccionada === datosPregunta.c) {
                correctasConsecutivas++;
                totalCorrectas++;
                
                if (correctasConsecutivas % 10 === 0 && correctasConsecutivas > 0) {
                    estrellasAcumuladas = correctasConsecutivas / 10;
                    actualizarMarcadorEstrellas();
                    
                    if (mensajesSecretos[correctasConsecutivas]) {
                        contenidoTextoSecreto.innerText = mensajesSecretos[correctasConsecutivas];
                        cajaMensajeSecreto.style.display = "block";
                        setTimeout(() => {
                            if (!juegoTerminado) cajaMensajeSecreto.style.display = "none";
                        }, 4000);
                    }
                }
                
                preguntaActual++;
                setTimeout(cargarPregunta, 200);
            } else {
                finalizarJuego(false);
            }
        }

        function finalizarJuego(victoria) {
            juegoTerminado = true;
            cajaMensajeSecreto.style.display = "none";

            if (victoria) {
                estrellasAcumuladas = 10;
                actualizarMarcadorEstrellas();
                contenedorPrincipal.innerHTML = `
                    <div class="screen-state" style="color: #00e5ff;">
                        <h2 class="blink" style="font-size: 1rem; margin-bottom: 20px;">¡VICTORIA ABSOLUTA!</h2>
                        <p style="font-size: 0.55rem; color: #fff; line-height: 2;">Has estado genial, ¡Anihangela estaría orgullosa de ti, ahora está estudiando en la universidad, dadle fuerzas! Saludos desde aqui Anihangela ¡Suerte!</p>
                        <div style="font-size: 3rem; margin: 20px 0;">★</div>
                        <button class="start-btn" onclick="iniciarTrivia()">PLAY AGAIN</button>
                    </div>
                `;
            } else {
                contenedorPrincipal.innerHTML = `
                    <div class="screen-state" style="color: #d32f2f;">
                        <h2 class="blink" style="font-size: 1.1rem; margin-bottom: 20px;">GAME OVER</h2>
                        <p style="font-size: 0.6rem; color: #fff; line-height: 1.8;">El registro de Control de Estudios rechazó la postulación por un fallo en los datos.</p>
                        <p style="margin-top: 15px; color: #ffeb3b; font-size: 0.6rem;">RACHA MAXIMA: ${correctasConsecutivas}</p>
                        <button class="start-btn" onclick="iniciarTrivia()">RETRY</button>
                    </div>
                `;
                estrellasAcumuladas = 0;
                actualizarMarcadorEstrellas();
            }
        }

        mostrarPantallaInicio();
    </script>
</body>
</html>
